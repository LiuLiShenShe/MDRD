[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrd"
version = "0.1.0"
description = "Traceable mixed-distance reconstruction diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "opencv-python", "matplotlib", "plotly", "pycolmap", "PyYAML", "requests"]

[project.scripts]
mdrd = "mdrd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs external media or SfM tools"]
